<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA Calculator</title>
    <style>
        .container{
            width: 100%;
            height: 100vh;
            background-color: aqua;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        
        .select-container select{
            width: 200px;
            height: 30px;
            border: 1px solid black;
            border-radius: 25px;
            background-color: white;
            padding: 5px;
            margin: 15px;

        }

        #cgpa{
            width: 150px;
            height: 40px;
            border: 1px solid black;
            border-radius: 25px;
            background-color: rgb(18, 209, 18);
            margin-top: 5px;
        }
     
    </style>
</head>
<body>
    <div class="container">
       <h1>
        CGPA Calculator
       </h1>
       <div class="select-container">
            <div>
                <label> Enter Subject1 Gade</label>
                <select id="sub-1">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>

            <div>
                <label> Enter Subject2 Gade</label>
                <select id="sub-2">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>

            <div>
                <label> Enter Subject3 Gade</label>
                <select id="sub-3">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>

            <div>
                <label> Enter Subject4 Gade</label>
                <select id="sub-4">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>
            
            <div>
                <label> Enter Subject5 Gade</label>
                <select id="sub-5">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>
        
            <div>
                <label> Enter Subject6 Gade</label>
                <select id="sub-6">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>

            <div>
                <label> Enter Subject7 Gade</label>
                <select id="sub-7">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>
        
            <div>
                <label> Enter Subject8 Gade</label>
                <select id="sub-8">
                    <option value="0">select</option>
                    <option value="10">A+</option>
                    <option value="9">A</option>
                    <option value="8">B</option>
                    <option value="7">C</option>
                    <option value="6">D</option>
                </select>
            </div>


        </div>

        <button onclick="calculate()"  id="cgpa">Calculate CGPA</button>

        <p id="result">Your CGPA is: </p>
    </div>

    <script>
        function calculate(){
            var credits=[3,3,3,3,1.5,1.5,1.5]
            var prod_grade_credits=0
            var total_cred=0
            for(var i=0; i<credits.length; i++){
                var sub=document.getElementById(`sub-${i+1}`).value
                if(sub=="0"){
                    alert("Plesse Enter all  the subject")
                    return
                }
                prod_grade_credits+=sub*credits[i]
                total_cred+=credits[i]
            }
            var cgpa=prod_grade_credits/total_cred
            // alert(`Your CGPA is ${cgpa.toFixed(2)}`)                           // toFixed(2) - display only 2 decimal after point.
            var result=document.getElementById("result")
            result.innerText=`Your CGPA is ${cgpa.toFixed(2)}`
        }
    </script>
</body>
</html>
